name: Xchange One · Next.js CI
on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/xchange-one-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/xchange-one-ci.yml"
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build production app (demo mode)
        run: npm run build
